<h2>RxJS 2 - daty</h2>
<p>
  Stwórz cold observable który wyemituje kolejne daty kolejnych 10 dni od
  podanej daty.
</p>
<p>Wykorzystaj klasę <code>Observable</code></p>
<p>
  <b>Bonus</b>: Zmodyfikuj strumień by emitował co 1s (użyj
  <code>setInterval</code> lub operatora <code>interval</code>).
</p>
<h3>Wynik:</h3>
<section>
  <p>Daty: {{ tenDaysFromNow$ | toArray | async }}</p>
</section>
